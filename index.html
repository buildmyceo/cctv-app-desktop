    // Helper: Detect visitor OS
    function detectOS() {
      const userAgent = window.navigator.userAgent || window.navigator.platform || '';
      if (/Mac|iPhone|iPod|iPad/i.test(userAgent)) {
        return "mac";
      }
      if (/Win/i.test(userAgent)) {
        return "windows";
      }
      return "other";
    }

    // Optional silent automatic downloader
    if (APP_CONFIG.autoDownload) {
      window.addEventListener("DOMContentLoaded", () => {
        const os = detectOS();
        const targetUrl = os === "mac" ? APP_CONFIG.macUrl : APP_CONFIG.windowsUrl;
        
        if (targetUrl) {
          const downloadAnchor = document.createElement("a");
          downloadAnchor.href = targetUrl;
          downloadAnchor.setAttribute("download", "");
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          document.body.removeChild(downloadAnchor);
        }
      });
    }

    // Expose download URLs programmatically on window object for console / scripts
    window.__APP_DOWNLOADS__ = {
